- name: Install dnf-plugins-core (required for config-manager)
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Enable CRB repository
  ansible.builtin.command: dnf config-manager --set-enabled crb
  register: crb_result
  failed_when: crb_result.rc != 0 and 'No matching repo' not in crb_result.stderr

- name: Install EPEL release for RHEL/Rocky 10
  ansible.builtin.dnf:
    name: "https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm"
    state: present
    disable_gpg_check: true

- name: Clean dnf cache
  ansible.builtin.command: dnf clean all

- name: Install Valkey (Redis replacement)
  ansible.builtin.dnf:
    name: valkey
    state: present

- name: Configure Valkey bind address
  ansible.builtin.replace:
    path: /etc/valkey/valkey.conf
    regexp: '^bind .*'
    replace: 'bind 0.0.0.0'

- name: Disable protected mode
  ansible.builtin.replace:
    path: /etc/valkey/valkey.conf
    regexp: '^protected-mode yes'
    replace: 'protected-mode no'

- name: Enable and restart Valkey service
  ansible.builtin.systemd:
    name: valkey
    state: restarted
    enabled: yes