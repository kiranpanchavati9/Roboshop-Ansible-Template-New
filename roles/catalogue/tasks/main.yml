---
- name: Import Node JS
  ansible.builtin.import_role:
    name: common
    tasks_from: nodejs
  vars:
    component: catalogue

# ---------------- REPOSITORY SETUP ----------------
- name: Copy MongoDB repo file
  ansible.builtin.template:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongodb.repo

- name: Install MongoDB Shell (mongosh)
  ansible.builtin.dnf:
    name: mongodb-mongosh
    state: present

# ---------------- MongoDB DATA INITIALIZATION ----------------
- name: Check if catalogue data already exists
  ansible.builtin.command: >
    mongosh --host mongodb-{{ env }}.kiranpanchavati.online
    --quiet --eval "db.getSiblingDB('catalogue').products.countDocuments()"
  register: catalogue_count
  changed_when: false
  ignore_errors: yes

- name: Load catalogue master data
  ansible.builtin.shell: >
    mongosh --host mongodb-{{ env }}.kiranpanchavati.online
    < /app/db/master-data.js
  when:
    - catalogue_count.stdout is defined
    - catalogue_count.stdout | int == 0

# ---------------- SYSTEMD ----------------
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Enable and start catalogue service
  ansible.builtin.systemd_service:
    name: catalogue
    state: started
    enabled: true

# ---------------- VALIDATION ----------------
- name: Verify catalogue service is running
  ansible.builtin.command: systemctl is-active catalogue
  register: catalogue_service_status
  changed_when: false
  failed_when: catalogue_service_status.stdout != "active"